server:
  port: "${SERVER_PORT:8003}"
spring:
  application:
    name: "ms_reportes_crediya"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: "dev"
jwt:
  secret: "${JWT_SECRET}"
entrypoint:
  sqs:
    region: "${AWS_REGION}"
    endpoint: "${AWS_SQS_ENDPOINT}"
    queueUrl: "${AWS_SQS_QUEUEURL_REPORTS}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
aws:
  region: ${AWS_REGION}
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
